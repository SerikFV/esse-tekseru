name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: esse_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: esse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esse_test -d esse_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://esse_test:ci_test_only@127.0.0.1:5432/esse_test
      RUN_DATABASE_TESTS: "1"
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check frontend/script.js
